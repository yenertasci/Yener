<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sistem Ayarları - Metal Takip</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f7f6; }
        nav { background: #2c3e50; padding: 12px; margin-bottom: 20px; border-radius: 6px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        
        .settings-card { background: white; padding: 25px; border-radius: 8px; width: 500px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .settings-card h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ddd; padding-bottom: 8px; }
        
        label { display: block; margin-top: 15px; font-weight: bold; color: #555; }
        input[type="text"], select { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        .checkbox-group { display: flex; align-items: center; margin-top: 15px; gap: 10px; }
        .checkbox-group input { width: auto; margin: 0; }
        
        .btn { background: #27ae60; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-size: 15px; margin-top: 20px; width: 100%; }
        .btn:hover { background: #219653; }
        
        .alert { background: #d4edda; color: #155724; padding: 10px; margin-bottom: 15px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

    <!-- Ortak Üst Menü -->
    <nav>
        <a href="panel.html">Ana Panel</a>
        <a href="stok.html">Stok Takibi</a>
        <a href="profil.html">Profilim</a>
        <a href="ayarlar.html">Ayarlar</a>
        <a href="giris.html" style="float: right;">Çıkış</a>
    </nav>

    <div class="settings-card">
        <h3>Sistem ve Barkod Ayarları</h3>
        
        <div id="successAlert" class="alert">Ayarlar başarıyla kaydedildi!</div>

        <form id="settingsForm">
            <label>Firma / Şirket Adı:</label>
            <input type="text" id="firmaAdi" value="Örnek Metal Sanayi A.Ş." required>

            <label>Varsayılan Barkod Formatı:</label>
            <select id="barkodFormat">
                <option value="CODE128">CODE128 (Önerilen - Harf/Rakam)</option>
                <option value="EAN13">EAN13 (Standart Ürün Barkodu)</option>
                <option value="CODE39">CODE39 (Endüstriyel)</option>
            </select>

            <label>Stok Kritik Uyarı Sınırı (Adet/Boy):</label>
            <input type="text" id="kritikSinir" value="5">

            <div class="checkbox-group">
                <input type="checkbox" id="otoYazdir" checked>
                <label for="otoYazdir" style="margin:0; font-weight:normal;">İş emri oluşturulduğunda barkod ekranını otomatik tetikle</label>
            </div>

            <button type="submit" class="btn">Ayarları Kaydet</button>
        </form>
    </div>

    <script>
        // Sayfa açıldığında kayıtlı ayarları yükle
        window.addEventListener('DOMContentLoaded', () => {
            const savedFirma = localStorage.getItem('ayar_firma');
            const savedFormat = localStorage.getItem('ayar_format');
            const savedSinir = localStorage.getItem('ayar_sinir');
            const savedOto = localStorage.getItem('ayar_oto');

            if(savedFirma) document.getElementById('firmaAdi').value = savedFirma;
            if(savedFormat) document.getElementById('barkodFormat').value = savedFormat;
            if(savedSinir) document.getElementById('kritikSinir').value = savedSinir;
            if(savedOto !== null) document.getElementById('otoYazdir').checked = (savedOto === 'true');
        });

        // Ayarları kaydetme işlemi
        document.getElementById('settingsForm').addEventListener('submit', function(e) {
            e.preventDefault();

            localStorage.setItem('ayar_firma', document.getElementById('firmaAdi').value);
            localStorage.setItem('ayar_format', document.getElementById('barkodFormat').value);
            localStorage.setItem('ayar_sinir', document.getElementById('kritikSinir').value);
            localStorage.setItem('ayar_oto', document.getElementById('otoYazdir').checked);

            // Başarılı mesajını göster
            const alertBox = document.getElementById('successAlert');
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 3000);
        });
    </script>

</body>
</html>
