<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Üretim Süreç Takibi - Metal Takip</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f7f6; }
        nav { background: #2c3e50; padding: 12px; margin-bottom: 20px; border-radius: 6px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ddd; padding-bottom: 8px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #34495e; color: white; }

        .durum-bekliyor { background: #f39c12; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .durum-tamam { background: #27ae60; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        
        .btn-etiket { background: #2980b9; color: white; padding: 5px 10px; text-decoration: none; border-radius: 3px; font-size: 12px; }
        .btn-etiket:hover { background: #2471a3; }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <nav>
        <a href="panel.html">Ana Panel</a>
        <a href="yeni-is-emri.html">Yeni İş Emri</a>
        <a href="uretim.html" style="color: #f1c40f;">Üretim</a>
        <a href="stok-takip.html">Stok Takip</a>
        <a href="raporlar.html">Raporlar</a>
    </nav>

    <div class="card">
        <h3>Aktif Üretim ve Kesim Tezgahı</h3>
        <table>
            <thead>
                <tr>
                    <th>İş Emri No</th>
                    <th>Müşteri / Proje</th>
                    <th>Metal Malzeme</th>
                    <th>Ölçü / Adet</th>
                    <th>Durum</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="uretimTablo">
                <!-- JavaScript ile doldurulacak -->
            </tbody>
        </table>
    </div>

    <script>
        const kayitliIsler = JSON.parse(localStorage.getItem('metal_is_emirleri')) || [];
        const tabloGovde = document.getElementById('uretimTablo');

        if(kayitliIsler.length === 0) {
            tabloGovde.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#7f8c8d;">Aktif üretim emri bulunmuyor.</td></tr>';
        } else {
            kayitliIsler.forEach(item => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.no}</strong></td>
                    <td>${item.musteri}</td>
                    <td>${item.malzeme}</td>
                    <td>${item.kesim}</td>
                    <td><span class="durum-tamam">Üretimde / Hazır</span></td>
                    <td><a href="etiket.html?no=${encodeURIComponent(item.no)}&musteri=${encodeURIComponent(item.musteri)}&malzeme=${encodeURIComponent(item.malzeme)}&kesim=${encodeURIComponent(item.kesim)}" class="btn-etiket">Etiketi Gör</a></td>
                `;
                tabloGovde.appendChild(tr);
            });
        }
    </script>

</body>
</html>
