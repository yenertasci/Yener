<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Metal Stok Takibi - Metal Takip</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f7f6; }
        nav { background: #2c3e50; padding: 12px; margin-bottom: 20px; border-radius: 6px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .card h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #ddd; padding-bottom: 8px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #34495e; color: white; }

        .badge-green { background: #27ae60; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .badge-red { background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }

        .form-inline { display: flex; gap: 10px; margin-top: 10px; }
        .form-inline input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        .btn-ekle { background: #27ae60; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-ekle:hover { background: #219653; }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <nav>
        <a href="panel.html">Ana Panel</a>
        <a href="yeni-is-emri.html">Yeni İş Emri</a>
        <a href="uretim.html">Üretim</a>
        <a href="stok-takip.html" style="color: #f1c40f;">Stok Takip</a>
        <a href="raporlar.html">Raporlar</a>
    </nav>

    <!-- Yeni Stok Ekleme Kartı -->
    <div class="card">
        <h3>Depoya Yeni Metal Malzeme Ekle</h3>
        <form id="stokEkleForm" class="form-inline">
            <input type="text" id="yeniMalzeme" placeholder="Malzeme Adı (Örn: 5mm DKP Sac)" required>
            <input type="text" id="yeniKalite" placeholder="Kalite (Örn: ST37)" required>
            <input type="text" id="yeniOlcu" placeholder="Ölçü (Örn: 1500x3000 mm)" required>
            <input type="number" id="yeniAdet" placeholder="Adet / Boy" min="1" required style="max-width: 120px;">
            <button type="submit" class="btn-ekle">Stok Ekle</button>
        </form>
    </div>

    <!-- Stok Listesi -->
    <div class="card">
        <h3>Mevcut Depo Stokları</h3>
        <table>
            <thead>
                <tr>
                    <th>Malzeme Kodu</th>
                    <th>Malzeme Cinsi</th>
                    <th>Kalite</th>
                    <th>Ölçüler</th>
                    <th>Miktar (Adet/Boy)</th>
                    <th>Durum</th>
                </tr>
            </thead>
            <tbody id="stokTablosu">
                <!-- JavaScript ile doldurulacak -->
            </tbody>
        </table>
    </div>

    <script>
        // Varsayılan stoklar veya localStorage'dan gelenler
        let stoklar = JSON.parse(localStorage.getItem('metal_stoklar')) || [
            { kod: "STK-101", ad: "3mm DKP Sac Plaka", kalite: "ST37", olcu: "1250x2500 mm", miktar: 45 },
            { kod: "STK-102", ad: "40x40 Kutu Profil", kalite: "S235JR", olcu: "6000 mm (Boy)", miktar: 3 },
            { kod: "STK-103", ad: "10mm Lama Demir", kalite: "S355", olcu: "4000 mm (Boy)", miktar: 18 }
        ];

        function stoklariListele() {
            const tbody = document.getElementById('stokTablosu');
            tbody.innerHTML = '';

            stoklar.forEach(item => {
                let durumHTML = item.miktar <= 5 
                    ? '<span class="badge-red">Kritik Stok</span>' 
                    : '<span class="badge-green">Yeterli</span>';

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.kod}</strong></td>
                    <td>${item.ad}</td>
                    <td>${item.kalite}</td>
                    <td>${item.olcu}</td>
                    <td>${item.miktar} Adet</td>
                    <td>${durumHTML}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('stokEkleForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const yeniStok = {
                kod: "STK-" + Math.floor(100 + Math.random() * 900),
                ad: document.getElementById('yeniMalzeme').value,
                kalite: document.getElementById('yeniKalite').value,
                olcu: document.getElementById('yeniOlcu').value,
                miktar: parseInt(document.getElementById('yeniAdet').value)
            };

            stoklar.unshift(yeniStok);
            localStorage.setItem('metal_stoklar', JSON.stringify(stoklar));

            stoklariListele();
            this.reset();
        });

        stoklariListele();
    </script>

</body>
</html>
