<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okey Portalı - Yönetim Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

    <!-- Üst Bar -->
    <header class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-yellow-400">👑 Okey Script - Yönetim Paneli</h1>
        <span class="text-xs bg-red-600 px-3 py-1 rounded font-bold">Lisans: Aktif (Sınırsız)</span>
    </header>

    <!-- İçerik Alanı -->
    <main class="flex-1 p-6 max-w-6xl mx-auto w-full space-y-6">
        
        <!-- İstatistik Kartları -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                <p class="text-gray-400 text-xs">Toplam Oyuncu</p>
                <h3 class="text-2xl font-bold text-white mt-1">1,452</h3>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                <p class="text-gray-400 text-xs">Aktif Masalar</p>
                <h3 class="text-2xl font-bold text-emerald-400 mt-1">28</h3>
            </div>
            <div class="bg-gray-800 p-4 rounded-lg border border-gray-700">
                <p class="text-gray-400 text-xs">Toplam Çip Satışı (TL)</p>
                <h3 class="text-2xl font-bold text-yellow-400 mt-1">₺42,850</h3>
            </div>
        </div>

        <!-- Üye Çip Yönetim Tablosu -->
        <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden">
            <div class="p-4 bg-gray-750 border-b border-gray-700 font-bold text-sm">Son Kayıt Olan Üyeler & Çip Düzenleme</div>
            <table class="w-full text-left text-xs">
                <thead class="bg-gray-700 text-gray-300">
                    ID | Kullanıcı Adı | Çip Miktar | İşlem
                </thead>
                <tbody class="divide-y divide-gray-700">
                    <tr>
                        <td class="p-3">#101</td>
                        <td class="p-3 font-bold">ahmet_king</td>
                        <td class="p-3 text-yellow-400">1,500,000 Çip</td>
                        <td class="p-3">
                            <button onclick="alert('Çip güncellendi!')" class="bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded text-white font-bold">+ Çip Ekle</button>
                        </td>
                    </tr>
                    <tr>
                        <td class="p-3">#102</td>
                        <td class="p-3 font-bold">selin_okey</td>
                        <td class="p-3 text-yellow-400">450,000 Çip</td>
                        <td class="p-3">
                            <button onclick="alert('Çip güncellendi!')" class="bg-blue-600 hover:bg-blue-500 px-2 py-1 rounded text-white font-bold">+ Çip Ekle</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>
</body>
</html>
