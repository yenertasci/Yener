<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap - Metal Takip</title>
    <style>
        body { font-family: Arial, sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; width: 360px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .login-card h2 { text-align: center; color: #2c3e50; margin-top: 0; border-bottom: 2px solid #ddd; padding-bottom: 8px; }
        
        label { display: block; margin-top: 12px; font-weight: bold; color: #555; font-size: 14px; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn { background: #2980b9; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 4px; font-size: 15px; margin-top: 20px; font-weight: bold; }
        .btn:hover { background: #2471a3; }
        
        .register-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .register-link a { color: #27ae60; text-decoration: none; font-weight: bold; }
        .register-link a:hover { text-decoration: underline; }

        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Sistem Girişi</h2>
        <form id="loginForm">
            <label>Sicil / Kullanıcı No:</label>
            <input type="text" id="logSicil" placeholder="Örn: OP-104" required>

            <label>Şifre:</label>
            <input type="password" id="logSifre" placeholder="******" required>

            <button type="submit" class="btn">Giriş Yap</button>
            <div id="errorAlert" class="error-msg">Hatalı sicil numarası veya şifre!</div>
        </form>

        <div class="register-link">
            Hesabınız yok mu? <a href="register.html">Kayıt Ol</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const girilenSicil = document.getElementById('logSicil').value;
            const girilenSifre = document.getElementById('logSifre').value;

            // Kayıtlı kullanıcıyı localStorage'dan al
            const kayitliKullanici = JSON.parse(localStorage.getItem('aktif_kullanici'));

            // Basit kontrol (Kayıtlı kullanıcı varsa veya test amaçlı varsayılan değer)
            if (kayitliKullanici && kayitliKullanici.sicil === girilenSicil && kayitliKullanici.sifre === girilenSifre) {
                window.location.href = 'panel.html';
            } else if (!kayitliKullanici && girilenSicil === "admin" && girilenSifre === "12345") {
                // Varsayılan yönetici girişi
                window.location.href = 'panel.html';
            } else {
                document.getElementById('errorAlert').style.display = 'block';
            }
        });
    </script>

</body>
</html>
