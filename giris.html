<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap - Metal Takip Sistemi</title>
    <style>
        body { font-family: Arial, sans-serif; background: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 8px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .login-card h2 { text-align: center; color: #2c3e50; margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 8px 0 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background: #27ae60; color: white; border: none; padding: 10px; width: 100%; cursor: pointer; border-radius: 4px; font-size: 16px; }
        .btn:hover { background: #219653; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Sistem Girişi</h2>
        <form onsubmit="event.preventDefault(); window.location.href='panel.html';">
            <label>Kullanıcı Adı / Sicil No:</label>
            <input type="text" placeholder="Örn: op102" required>
            <label>Şifre:</label>
            <input type="password" placeholder="******" required>
            <button type="submit" class="btn">Giriş Yap</button>
        </form>
    </div>
</body>
</html>
